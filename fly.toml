# Sigil's ZEC + Tor robot on Fly.io: the scanner, the worker and the onion
# service in one always-on machine. The public site is on Vercel, so there's
# no [http_service] here: no public port, and nothing for Fly to stop when idle.
#
# Secrets (keys, database) are set with `fly secrets import`, never in this file.

app = "sigil-zec"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_ONION_ADDRESS = "sigillwspsxyq5oufblbnmciirf4tsjhtdohh63rntrfshfliird7xqd.onion"

[env]
  # Fly's init is PID 1, so tini has to register as a subreaper to clean up
  # exited child processes (the scanner restarts, tor helpers).
  TINI_SUBREAPER = "1"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
