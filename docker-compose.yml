# Local Postgres for the ZEC relayer. Port 5434 so it doesn't collide with
# other projects' databases on this machine.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - relay_pg:/var/lib/postgresql/data
volumes:
  relay_pg:
