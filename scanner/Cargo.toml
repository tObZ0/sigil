[package]
name = "relay-scanner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
orchard = "0.16"
zcash_note_encryption = "0.5"
zcash_address = "0.14"
zcash_protocol = "0.11"
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[profile.release]
lto = "thin"
strip = true
