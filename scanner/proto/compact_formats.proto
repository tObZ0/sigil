// Subset of lightwalletd's compact_formats.proto.
// Field numbers match upstream; anything we don't read (Sapling, chain
// metadata, headers) is left out and skipped by the decoder.
// Upstream: github.com/zcash/lightwallet-protocol

syntax = "proto3";
package cash.z.wallet.sdk.rpc;

message CompactBlock {
  uint32 protoVersion = 1;
  uint64 height = 2;
  bytes hash = 3;
  bytes prevHash = 4;
  uint32 time = 5;
  repeated CompactTx vtx = 7;
}

message CompactTx {
  uint64 index = 1;
  bytes hash = 2;
  repeated CompactOrchardAction actions = 6;
}

message CompactOrchardAction {
  bytes nullifier = 1;    // [32] of the spent note
  bytes cmx = 2;          // [32] x-coordinate of the new note commitment
  bytes ephemeralKey = 3; // [32]
  bytes ciphertext = 4;   // [52] first 52 bytes of encCiphertext
}
